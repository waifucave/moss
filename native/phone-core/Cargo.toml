[package]
name = "moss-phone-core"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "The phone apps' shared core: device keys, pairing, the link and its RPC, card answers (spec §8, §5.5, §10)"

[lib]
name = "moss_phone_core"
# `lib` for the Rust tests, `cdylib` for Android's .so, `staticlib` for the iPhone's XCFramework.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
# Generates the Swift and Kotlin bindings from the built library (`cargo run --bin uniffi-bindgen -- generate ...`).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
# The link's own iroh, at the sidecar's exact version (native/link/Cargo.toml), so both ends speak one QUIC.
iroh = "=1.4.1"
n0-future = "=0.3.2"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
uniffi = { version = "=0.32.2", features = ["tokio"] }
serde_json = "=1.0.154"
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
curve25519-dalek = "=5.0.0"
sha2 = "=0.11.1"
hmac = "=0.13.0"
hkdf = "=0.13.0"
p256 = { version = "=0.14.0", features = ["ecdsa"] }
base64 = "=0.22.1"
getrandom = "=0.4.3"
ryu-js = "=1.0.4"
zeroize = "=1.9.1"
thiserror = "=2.0.21"
# libc 0.2.191 (the sidecar's) hides net/route.h's constants and `in6_ifreq` on iOS, so iroh's netwatch 0.19.3 and
# netdev 0.46.3 don't build for the iPhone; 0.2.189 still has them for every Apple target. Pinned here only (the
# desktop sidecar keeps its own lockfile); lift it once a netwatch release builds against a newer libc on iOS.
libc = "=0.2.189"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["full"] }

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
lto = false

