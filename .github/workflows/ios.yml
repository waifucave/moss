name: iOS apps

# Builds MOSS and MOSS Code for the simulator and runs the shared package's tests, the cards' drawn-button tests and the
# Release check. A gate: any of these failing fails the job. The accessibility audits report only (the system's own bars
# trip them), and run apart from the gated tests.
on:
  push:
    branches: ["lane-int/**", "lane/ia-**", "lane/iw-**"]
    paths: ["apps/ios/**", "packages/protocol/generated/**", "packages/plugin-sdk/src/ui/faces/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", "packages/protocol/generated/**", "packages/plugin-sdk/src/ui/faces/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          # xcodegen at a fixed release, checked against the release asset's own SHA-256 (GitHub's digest for it).
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.47.0/xcodegen.zip
          echo "6ef12a3ef5327c2c713397f46d9160550f8b1cdc5c925cd884d65c77c9f696cd  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Pick a simulator
        run: |
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Package tests (simulator, no app host)
        working-directory: apps/ios/Packages/MossPhoneKit
        run: |
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -o 'iPhone [0-9A-Za-z ]*' | head -1 | sed 's/ *$//')"
          xcodebuild test -scheme MossPhoneKit -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/dd-pkg" CODE_SIGNING_ALLOWED=NO
      - name: Generate the project
        run: xcodegen generate
      - name: Build MOSS
        run: xcodebuild -project MOSSPhone.xcodeproj -scheme MOSS -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: Build MOSS Code
        run: xcodebuild -project MOSSPhone.xcodeproj -scheme MOSSCode -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      - name: Release builds carry no launch-argument door
        run: |
          for S in MOSS MOSSCode; do
            xcodebuild -project MOSSPhone.xcodeproj -scheme $S -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-rel" CODE_SIGNING_ALLOWED=NO build
          done
          FOUND=0
          for APP in "$RUNNER_TEMP"/dd-rel/Build/Products/Release-iphonesimulator/*.app; do
            BIN="$APP/$(basename "$APP" .app)"
            for A in -newBotTry -newBot -scenario -screen -confirmUnpair -startNew -scrollTop -scrollTo -draft -picker -focus; do
              if strings -a "$BIN" "$APP"/*.debug.dylib 2>/dev/null | grep -qx -e "$A"; then echo "release build of $(basename "$APP") reads launch argument $A"; FOUND=1; fi
            done
          done
          # Nor the fake engine client or its sample data: a scenario name, a sample bot, the sample pairing code.
          for APP in "$RUNNER_TEMP"/dd-rel/Build/Products/Release-iphonesimulator/*.app; do
            BIN="$APP/$(basename "$APP" .app)"
            for W in FakeEngineClient SampleData midTurn cardStates sendFails botLimit providerConsent manyPaths moss-pair:sample "Use a sample code" Juniper Marlow Sorrel Hazel "Quarterly report.pdf"; do
              if strings -a "$BIN" "$APP"/*.debug.dylib 2>/dev/null | grep -qF -e "$W"; then echo "release build of $(basename "$APP") carries the fake's '$W'"; FOUND=1; fi
            done
          done
          [ "$FOUND" = 0 ] && echo "no launch argument, fake or sample data in either Release build"
          exit $FOUND
      - name: The cards' drawn buttons (a cut card's Allow waits; the provider is drawn)
        run: |
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -o 'iPhone [0-9A-Za-z ]*' | head -1 | sed 's/ *$//')"
          xcodebuild test -project MOSSPhone.xcodeproj -scheme MOSS -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -only-testing:MOSSUITests/CardGateUITests -resultBundlePath "$RUNNER_TEMP/cardgate.xcresult" 2>&1 | grep -E "Test Case|error:|XCTAssert|Executed|TEST (SUCC|FAIL)|IW " | cut -c1-400 ; exit ${PIPESTATUS[0]}
      # The bundle holds only the FAKE app's screens (sample data, no person's words or computer): a screenshot and the
      # view hierarchy at each failed card test. Kept for pushes and manual runs, never uploaded from a pull request's run.
      - name: Keep the cards' test results (screenshot and view hierarchy at each failure)
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cardgate-xcresult
          path: ${{ runner.temp }}/cardgate.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Accessibility audits at the default and the largest text size (MOSS)
        continue-on-error: true
        run: |
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -o 'iPhone [0-9A-Za-z ]*' | head -1 | sed 's/ *$//')"
          xcodebuild test -project MOSSPhone.xcodeproj -scheme MOSS -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -skip-testing:MOSSUITests/CardGateUITests 2>&1 | tee "$RUNNER_TEMP/ui-moss.log" | grep -E "AUDIT|error:|Executed|TEST (SUCC|FAIL)" | cut -c1-400
      - name: Accessibility audits at the default and the largest text size (MOSS Code)
        continue-on-error: true
        run: |
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -o 'iPhone [0-9A-Za-z ]*' | head -1 | sed 's/ *$//')"
          xcodebuild test -project MOSSPhone.xcodeproj -scheme MOSSCode -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui-code.log" | grep -E "AUDIT|error:|Executed|TEST (SUCC|FAIL)" | cut -c1-400
