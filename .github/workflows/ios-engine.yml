name: iOS apps on the real engine

# Lane IW's proof: MOSS and MOSS Code, built on the real engine client over the phone core (apps/ios/project-real.yml),
# each run a test hosted in the app (so its Keychain is real) that pairs with an engine started on this runner from source
# (apps/ios/EngineTests/harness/engine.ts: temp home, the real link sidecar on loopback, fake brains for the bots and a
# coding session), sends and hears replies, answers cards from the card on screen, survives the engine restarting and
# unpairs. Not gating: a separate workflow whose job may fail without holding a merge.
on:
  push:
    branches: ["lane/iw-**", "lane-int/**"]
    paths: ["apps/ios/**", "native/phone-core/**", ".github/workflows/ios-engine.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ios-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: never

jobs:
  engine:
    name: iOS apps · real engine · simulator
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Pick a simulator
        run: |
          sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIM=$sim" >> "$GITHUB_ENV"
          echo "simulator $sim"
      # The Swift-only client first: a Swift error fails here in minutes, before any Rust is built.
      - name: The engine client's own tests (no core)
        working-directory: apps/ios/Packages/MossEngineClient
        run: xcodebuild test -scheme MossEngineClient -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd-client" CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation 2>&1 | tail -60 ; exit ${PIPESTATUS[0]}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            native/link -> target
            native/phone-core -> target
      - name: Build the core's XCFramework and its Swift bindings (as phone-core.yml)
        run: |
          cd native/phone-core
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do cargo build --release --locked --lib --target $t; done
          cargo build --release --locked --lib
          cargo run --release --locked --features bindgen --bin uniffi-bindgen -- generate --library target/release/libmoss_phone_core.dylib --language swift --out-dir "$RUNNER_TEMP/swift"
          mkdir -p "$RUNNER_TEMP/headers"
          cp "$RUNNER_TEMP/swift/MossPhoneCoreFFI.h" "$RUNNER_TEMP/headers/"
          cp "$RUNNER_TEMP/swift/MossPhoneCoreFFI.modulemap" "$RUNNER_TEMP/headers/module.modulemap"
          mkdir -p apple/Sources/MossPhoneCore
          cp "$RUNNER_TEMP/swift/MossPhoneCore.swift" apple/Sources/MossPhoneCore/
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libmoss_phone_core.a -headers "$RUNNER_TEMP/headers" \
            -library target/aarch64-apple-ios-sim/release/libmoss_phone_core.a -headers "$RUNNER_TEMP/headers" \
            -library target/release/libmoss_phone_core.a -headers "$RUNNER_TEMP/headers" \
            -output apple/MossPhoneCoreFFI.xcframework
      - name: Build moss-link
        run: cargo build --release --locked --manifest-path native/link/Cargo.toml
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the real project and build both apps with their tests
        working-directory: apps/ios
        run: |
          # xcodegen at a fixed release (as phone-core.yml), not Homebrew's moving formula.
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.47.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          export PATH="$RUNNER_TEMP/xcodegen/xcodegen/bin:$PATH"
          xcodegen generate --spec project-real.yml
          for s in MOSSEngineTests MOSSCodeEngineTests; do
            xcodebuild build-for-testing -project MOSSPhone.xcodeproj -scheme $s -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" -skipPackagePluginValidation 2>&1 | grep -E "error:|warning: .*Moss(Engine|PhoneCore)|BUILD (SUCCEEDED|FAILED)|TEST BUILD" | head -80
            test ${PIPESTATUS[0]} -eq 0
          done
      - name: Start the engine
        env:
          MOSS_LINK_BIN: ${{ github.workspace }}/native/link/target/release/moss-link
        run: |
          nohup bun --preload ./packages/core/test/preload.ts apps/ios/EngineTests/harness/engine.ts --control-port 8790 --bind 127.0.0.1:47811 > "$RUNNER_TEMP/engine.log" 2>&1 &
          for i in $(seq 1 120); do grep -q "engine ready" "$RUNNER_TEMP/engine.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/engine.log"
          grep -q "engine ready" "$RUNNER_TEMP/engine.log"
      - name: MOSS on the real engine (hosted test)
        working-directory: apps/ios
        env:
          TEST_RUNNER_MOSS_IW_ENGINE: "1"
        run: |
          xcodebuild test-without-building -project MOSSPhone.xcodeproj -scheme MOSSEngineTests -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/moss.xcresult" 2>&1 | grep -E "Test Case|error|XCTAssert|skipped|Executed|TEST (SUCC|FAIL)" | cut -c1-400 ; test ${PIPESTATUS[0]} -eq 0
      - name: MOSS Code on the real engine (hosted test)
        if: always()
        working-directory: apps/ios
        env:
          TEST_RUNNER_MOSS_IW_ENGINE: "1"
        run: |
          xcodebuild test-without-building -project MOSSPhone.xcodeproj -scheme MOSSCodeEngineTests -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/code.xcresult" 2>&1 | grep -E "Test Case|error|XCTAssert|skipped|Executed|TEST (SUCC|FAIL)" | cut -c1-400 ; test ${PIPESTATUS[0]} -eq 0
      - name: No test was skipped
        if: always()
        run: |
          for r in moss code; do
            [ -d "$RUNNER_TEMP/$r.xcresult" ] || { echo "no result for $r"; exit 1; }
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$r.xcresult" | tee "$RUNNER_TEMP/$r.json"
            python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); print(sys.argv[1], "passed", s.get("passedTests"), "failed", s.get("failedTests"), "skipped", s.get("skippedTests")); sys.exit(1 if s.get("skippedTests",0) or s.get("failedTests",0) or not s.get("passedTests") else 0)' "$RUNNER_TEMP/$r.json"
          done
      - name: The Release builds a person runs carry no fake, sample data or launch-argument door
        if: always()
        working-directory: apps/ios
        run: |
          FOUND=0
          # The core's simulator slice is arm64 only (aarch64-apple-ios-sim), as the runner is.
          for S in MOSS MOSSCode; do
            xcodebuild -project MOSSPhone.xcodeproj -scheme $S -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-rel" -skipPackagePluginValidation ARCHS=arm64 build 2>&1 | grep -E "error:|Undefined symbol|ld: |BUILD (SUCCEEDED|FAILED)" | head -40
            test ${PIPESTATUS[0]} -eq 0 || FOUND=1
          done
          for APP in "$RUNNER_TEMP"/dd-rel/Build/Products/Release-iphonesimulator/*.app; do
            BIN="$APP/$(basename "$APP" .app)"
            for W in FakeEngineClient SampleData midTurn cardStates sendFails botLimit moss-pair:sample "Use a sample code" Juniper Marlow Sorrel; do
              if strings -a "$BIN" "$APP"/*.debug.dylib 2>/dev/null | grep -qF -e "$W"; then echo "release build of $(basename "$APP") carries '$W'"; FOUND=1; fi
            done
            strings -a "$BIN" | grep -qF CoreEngineClient || { echo "release build of $(basename "$APP") has no real engine client"; FOUND=1; }
          done
          [ "$FOUND" = 0 ] && echo "both Release builds run on the real client only"
          exit $FOUND
      - name: Logs
        if: always()
        run: |
          echo "--- engine"; cat "$RUNNER_TEMP/engine.log" || true
