name: Android apps

# Builds MOSS and MOSS Code for Android (debug, unsigned), runs the shared module's tests, and draws a picture of every
# screen in light and dark on the JVM (Robolectric and Roborazzi, no emulator), uploaded as the `android-pictures` artifact.
# A failed test fails the job and the run (no continue-on-error: a run that goes green with failed tests is worse than a
# red one). No secret, no signing, nothing published.
on:
  push:
    branches: ["lane-int/**", "lane/an-**"]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Dependency downloads are retried (bounded: 6 tries, backing off from 2 s) when Maven Central answers 429 or drops a
      # connection. Only downloads: a test is never run twice.
      GRADLE_OPTS: -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # JDK 21: Robolectric needs it to run Android 15 (SDK 35); the code itself targets Java 17.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: "8.13"
      # setup-gradle caches Gradle's own dependencies. Robolectric fetches its Android jar itself, outside Gradle, into
      # ~/.m2: that is cached here, keyed on the runner's OS and the Robolectric version.
      - name: Robolectric's version
        id: robolectric
        # The [versions] entry (`robolectric = "4.14.1"`), not the [libraries] one of the same name.
        run: |
          v=$(grep -m1 -E '^robolectric = "[0-9.]+"$' gradle/libs.versions.toml | cut -d'"' -f2)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: robolectric-cache
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ steps.robolectric.outputs.version }}
      - name: Fetch Robolectric's Android jar (cold cache only, bounded retry)
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        env:
          # What Robolectric 4.14.1 fetches for SDK 35 (the tests' @Config); another version fetches its own on demand.
          ANDROID_ALL: 15-robolectric-12650502-i7
        run: |
          set -euo pipefail
          dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ANDROID_ALL"
          mkdir -p "$dir"
          path="org/robolectric/android-all-instrumented/$ANDROID_ALL/android-all-instrumented-$ANDROID_ALL.jar"
          # Google's mirror of Maven Central first (Central throttles the shared runners' addresses with 429), then Central.
          for repo in https://maven-central.storage-download.googleapis.com/maven2 https://repo1.maven.org/maven2; do
            if curl -fsSL --retry 3 --retry-delay 20 --retry-all-errors --max-time 600 -o "$dir/android-all-instrumented-$ANDROID_ALL.jar" "$repo/$path"; then
              echo "fetched from $repo"; break
            fi
            rm -f "$dir/android-all-instrumented-$ANDROID_ALL.jar"
          done
      - name: Robolectric's Android jar is the pinned one (every run, cache hit or not)
        env:
          ANDROID_ALL: 15-robolectric-12650502-i7
          # Pinned in the repo, read once from Maven Central and Google's mirror (they agreed), never fetched at run time.
          ANDROID_ALL_SHA256: 33c2d7cc4186d4605269d5d411fa1818972c5b30a9f70bfbbd3d430b076af52f
        run: |
          set -euo pipefail
          jar="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$ANDROID_ALL/android-all-instrumented-$ANDROID_ALL.jar"
          echo "$ANDROID_ALL_SHA256  $jar" | sha256sum -c -
      - name: Build both apps
        # The fake variants: the real ones need the shared core's native library and binding, built by android-engine.yml.
        run: gradle --no-daemon --stacktrace :moss:assembleFakeDebug :code:assembleFakeDebug
      - name: Tests and pictures
        run: gradle --no-daemon --stacktrace :shared:recordRoborazziFakeDebug
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-pictures
          path: apps/android/shared/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-reports
          path: apps/android/shared/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
