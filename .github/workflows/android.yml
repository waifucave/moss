name: Android apps

# Builds MOSS and MOSS Code for Android (debug, unsigned), runs the shared module's tests, and draws a picture of every
# screen in light and dark on the JVM (Robolectric and Roborazzi, no emulator), uploaded as the `android-pictures` artifact.
# Not gating: it is a separate workflow, and its job may fail without holding a merge. No secret, no signing, nothing
# published.
on:
  push:
    branches: ["lane-int/**", "lane/an-**"]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # JDK 21: Robolectric needs it to run Android 15 (SDK 35); the code itself targets Java 17.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          gradle-version: "8.13"
      - name: Build both apps
        # The fake variants: the real ones need the shared core's native library and binding, built by android-engine.yml.
        run: gradle --no-daemon --stacktrace :moss:assembleFakeDebug :code:assembleFakeDebug
      - name: Tests and pictures
        run: gradle --no-daemon --stacktrace :shared:recordRoborazziDebug
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-pictures
          path: apps/android/shared/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-reports
          path: apps/android/shared/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
