name: CI

on:
  # No run on a push to main: every commit on main arrived through the merge queue, whose merge_group run already
  # tested that exact tree. A second run of the same tree only held runners the queue and open PRs were waiting for.
  pull_request:
    branches: [main, cowork/output-integration]
  # The merge queue: a queued pull request is tested again on top of the real latest main (and the PRs queued ahead of
  # it) before it lands, so two PRs that are each green against an older main can't break it together.
  merge_group:
    types: [checks_requested]
  # The integration branches (`lane-int/*`): lanes work on them with no pull request, so a push runs every area (as a
  # manual run does), the acceptance run included. A lane's own branch is run by hand: workflow_dispatch with --ref.
  push:
    branches: ["lane-int/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "all: every job. acceptance: only the acceptance run (and the names and layout checks), to run it again alone. acceptance-linux: only the Linux acceptance (lane LX), which no other choice but `all` and `acceptance` runs. acceptance-windows: only the Windows acceptance (lane WA), likewise"
        type: choice
        options: [all, acceptance, acceptance-linux, acceptance-windows]
        default: all
      # scripts/ci/lane start sets these two: a lane's run is as big as its change. `scoped` runs the jobs the files changed since `base`
      # need (scripts/ci-changes.ts: the same areas a pull request gets, with every one's FULL checks and the acceptance units it
      # touches); a path no area maps, or a base that cannot be read, runs everything. `all` (the default here) runs every job.
      scope:
        description: "all: every area. scoped: only the areas the files changed since `base` touch (a path no area maps runs everything)"
        type: choice
        options: [all, scoped]
        default: all
      base:
        description: "the commit the lane's changes are counted from (its merge-base with the integration branch); `all` with a base still runs the parked areas for their own sources changed since it"
        type: string
        default: ""
      # PARKED areas (scripts/ci-changes.ts PARKED): the old Chrome extension's native host (`swift`) and Cowork's launcher and libkrun queue
      # (`cowork`) build parts the first release does not ship, on a macOS runner. They run only when their own sources changed; this runs them anyway.
      parked:
        description: "true: also run the parked areas (swift, cowork), whatever changed"
        type: boolean
        default: false

# One run per branch: a new push to a pull request, or a new manual run on a branch, cancels the run it supersedes (a merge-queue
# group's run is never cancelled; two manual runs of different `only` don't meet). A push to an integration branch is the exception:
# a run that is running finishes, and at most ONE newer push waits behind it (a still newer push replaces the waiting one), so the
# branch's tip gets whole runs at the pace the runners allow, instead of every run being cancelled by the next merge (2026-11-24: on
# lane-int/moss six pushes in a row were cancelled and the tip was rarely tested as a whole). The price is the runner time of a run
# that is no longer the tip's when it ends, at most one at a time per integration branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event.inputs.only }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.event_name != 'push' }}

# A-M1: the `@waifucave` scope (the agent SDK's packages, `@waifucave/moss-*`, `@waifucave/mochi2d` and the owner's
# other packages) comes from GitHub Packages, which wants a token even to read. Every job may read it with this
# workflow's own token (`packages: read`); the repo's `.npmrc` takes it from NODE_AUTH_TOKEN, which only the install
# steps are given, so no test or build step sees it. A job with its own `permissions:` block sets `packages: read`
# itself if it installs. A private package must also grant this repository Actions read access in its own package
# settings.
permissions:
  contents: read
  packages: read

# The Rust the link sidecar (native/link) builds with: the link job, the macos job's link leg and the packages.
env:
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: never

jobs:
  # CI covers four machines (plan §3): macOS arm64, Windows x64, and Ubuntu x64 and arm64. On each it runs the
  # workspace packages' tests (the plugins' and services' among them), builds the daemon binary and builds the
  # unsigned app, whose window the UI test then opens (CI only: no app window on a developer's screen, plan §8): one
  # job per machine. The typecheck, the lockfile check, the galleries, the protocol codegen and the extension run
  # once, on Linux. Only what needs macOS runs there, in as few jobs as it can (macOS minutes are the dear ones; the
  # org's plan ran ten macOS jobs at once on 2026-11-16): one job for core, cli, the scripts and the compiled-binary gates (which need the agent runtime's
  # darwin-arm64 binary), and the browser host's Swift tests, only when apple/ changes.
  #
  # A pull request runs only the jobs whose inputs it changes (`changes`, scripts/ci-changes.ts); the names-and-layout
  # checks always run, and `gate` is the one check branch protection needs.
  #
  # A pull request runs the QUICK checks only, all on Linux, a few minutes each (owner's ruling, November 10: a try's
  # small changes were waiting an hour on CI and the queue): the names and layout, the typecheck, the lockfiles, the
  # protocol codegen, and the unit tests of the areas it changes that finish in about five minutes (the workspaces'
  # tests on linux-x64 alone, the core's three Linux shards, the scripts', the extension's). Everything else (each
  # machine's workspaces, daemon and app; the Linux packages; the installers; the tree, link and Linux-repository
  # jobs; the galleries; the macOS job) runs in the merge queue only, and on a manual run: a Windows-, macOS- or
  # arm64-only break is found there, the PR leaves the queue, and is fixed and enqueued again. `gate` still needs
  # every job: a job a PR doesn't run reports skipped, one it runs must pass.

  # Which areas this change touches. A pull request compares its merge commit with the base it merges into, and a
  # merge-queue group its head with the main it was built on (every PR in the group); a push to main and a manual run
  # take every area, and so does a group whose base can't be fetched.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.areas.outputs.workspaces }}
      daemon: ${{ steps.areas.outputs.daemon }}
      app: ${{ steps.areas.outputs.app }}
      packages: ${{ steps.areas.outputs.packages }}
      installers: ${{ steps.areas.outputs.installers }}
      gallery: ${{ steps.areas.outputs.gallery }}
      typecheck: ${{ steps.areas.outputs.typecheck }}
      lockfiles: ${{ steps.areas.outputs.lockfiles }}
      extension: ${{ steps.areas.outputs.extension }}
      core: ${{ steps.areas.outputs.core }}
      cli: ${{ steps.areas.outputs.cli }}
      scripts: ${{ steps.areas.outputs.scripts }}
      scriptsmac: ${{ steps.areas.outputs.scriptsmac }}
      codegen: ${{ steps.areas.outputs.codegen }}
      swift: ${{ steps.areas.outputs.swift }}
      verify: ${{ steps.areas.outputs.verify }}
      tree: ${{ steps.areas.outputs.tree }}
      link: ${{ steps.areas.outputs.link }}
      linuxrepo: ${{ steps.areas.outputs.linuxrepo }}
      adapters: ${{ steps.areas.outputs.adapters }}
      acceptance: ${{ steps.areas.outputs.acceptance }}
      cowork: ${{ steps.areas.outputs.cowork }}
      windows: ${{ steps.areas.outputs.windows }}
      fenceguard: ${{ steps.areas.outputs.fenceguard }}
      corelinux: ${{ steps.areas.outputs.corelinux }}
      # The acceptance units this run starts (a JSON list: the matrix of `acceptance` and `acceptance-linux`) and what the run says
      # about its own size (printed by `lane gate`, so a green gate is never mistaken for a full run).
      acceptance_units: ${{ steps.areas.outputs.acceptance_units }}
      scope: ${{ steps.areas.outputs.scope }}
      scope_ran: ${{ steps.areas.outputs.scope_ran }}
      scope_skipped: ${{ steps.areas.outputs.scope_skipped }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Which areas changed
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.only }}
          SCOPE: ${{ github.event.inputs.scope }}
          BASE: ${{ github.event.inputs.base }}
          PARKED_IN: ${{ github.event.inputs.parked }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # The parked areas take only their own sources from the diff (the lane's base, or the pull request's or group's); `parked: true` runs them.
          parked=""; [ "$PARKED_IN" = true ] && parked="--parked"
          case "$EVENT" in
            pull_request) bun scripts/ci-changes.ts --queue --base HEAD^1 --why "a pull request" ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$GROUP_BASE" || true
              bun scripts/ci-changes.ts --queue --base "$GROUP_BASE" --why "a merge-queue group" ;;
            # A push to an integration branch is the tip: every area.
            push) bun scripts/ci-changes.ts --all --why "a push to an integration branch runs everything" ;;
            # A manual run of the acceptance alone: no change, so no area but the acceptance run (every unit of it).
            *) if [ "$ONLY" = acceptance ] || [ "$ONLY" = acceptance-linux ] || [ "$ONLY" = acceptance-windows ]; then
                 bun scripts/ci-changes.ts --only-acceptance --why "a manual run of only: $ONLY"
               elif [ "$SCOPE" = scoped ] && [ -n "$BASE" ]; then
                 # The lane's own changes since its merge-base with the integration branch; a base this runner cannot fetch runs everything.
                 git fetch --no-tags --depth=1 origin "$BASE" || true
                 bun scripts/ci-changes.ts --refuse-empty --base "$BASE" $parked --why "a manual scoped run"
               elif [ "$SCOPE" = scoped ]; then
                 bun scripts/ci-changes.ts --all --parked --why "a scoped run with no base commit: fail closed"
               elif [ -n "$BASE" ]; then
                 git fetch --no-tags --depth=1 origin "$BASE" || true
                 bun scripts/ci-changes.ts --all --parked-base "$BASE" $parked --why "a manual run of everything"
               else
                 bun scripts/ci-changes.ts --all $parked --why "a manual run of everything"
               fi ;;
          esac

  # Always, whatever changed: the rename's residue and the live install's names over every tracked file, the rename's
  # rules, the layout's conventions and the CI areas. On Linux, in a minute or two, so a docs-only or report-only change
  # still runs them.
  names:
    name: names and layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The residue and the live install's names
        working-directory: packages/core
        run: bun test test/rename/

      - name: The rename's rules, the layout, the workspaces and the CI areas
        run: bun test scripts/rename/ scripts/layout.test.ts scripts/workspaces.test.ts scripts/ci-changes.test.ts scripts/ci/test-reads.test.ts scripts/ci/queue-map.test.ts

      # The headless shell's pin (lane L's, plugins/moss/plugins/browser/headless-shell.pins.json) follows the app's
      # Electron: the same Chromium milestone (spec §12.1). It warns while the file doesn't exist yet.
      - name: The headless shell's pin follows Electron
        run: bun scripts/check-headless-pin.ts

  # One job per machine (macOS arm64, Linux x64 and arm64, Windows x64), each step run only when this change needs it:
  #  - every workspace package's `test` (docs/moss-layout.md): `scripts/workspaces.ts` runs each one that has the
  #    script, where its `mossCi.os` allows, and skips core and cli (`mossCi.ownJob`). On Linux the tests run under
  #    a private D-Bus session with a gnome-keyring of their own, so the harness's throwaway Secret Service store never
  #    meets a real keyring.
  #  - the daemon binary, `moss-core`, built for the machine's own target (`scripts/build-daemon.ts`: packages/cli's
  #    compile:core with the target set, the dist define and the seal), then run once with `--version` on a temp home:
  #    it prints and exits, so no daemon starts. Then verify:sealed-core runs it with every door to foreign code set.
  #    Unsigned on every OS but for the gate's own ad hoc hardened-runtime copy on macOS; signing is the release's.
  #  - the app (apps/desktop), built and packaged unsigned and unpacked by electron-builder (`bun run build:app`), then
  #    the UI test opens it twice, under Electron and as the packaged app, and reads back its one sandboxed window.
  #    Linux runs it, and the browser tests, under xvfb, with unprivileged user namespaces allowed again for Chromium's
  #    sandbox (Ubuntu 24.04's AppArmor turns them off by default).
  # One job, not three, so a macOS runner is taken once per change, not three times.
  # A later part still runs after an earlier one fails, so one run reports all three.
  #
  # Windows is its own job, `machine-windows` (the same steps, by YAML anchor): the lane gate (`lane-gate`) leaves the
  # Windows jobs out, so a lane whose only red is a known Windows break still has a usable result, while `gate` (the
  # merge queue's) needs them all.
  machine:
    name: ${{ matrix.target }} (workspaces, daemon, app)
    needs: changes
    # Not on a pull request (its workspaces' tests run in `workspaces-pr`, on linux-x64): the merge queue and a manual run.
    if: &machine-if github.event_name != 'pull_request' && (needs.changes.outputs.workspaces == 'true' || needs.changes.outputs.daemon == 'true' || needs.changes.outputs.app == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # macOS and Linux: the job runs in the merge queue, on a push to an integration branch and on a manual run only (a
      # pull request takes none of them).
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    env: &machine-env
      WORKSPACES: ${{ needs.changes.outputs.workspaces }}
      DAEMON: ${{ needs.changes.outputs.daemon }}
      APP: ${{ needs.changes.outputs.app }}
    steps: &machine-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: The private Secret Service's tools and the display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-1-0 xvfb xauth weston

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workspaces · test
        if: env.WORKSPACES == 'true' && runner.os != 'Linux'
        run: bun scripts/workspaces.ts run test

      - name: Workspaces · test (on a private Secret Service)
        if: env.WORKSPACES == 'true' && runner.os == 'Linux'
        run: scripts/with-private-secret-service.sh bun scripts/workspaces.ts run test

      # A server's install and self-update on Windows (#244): the cli's suite runs on macOS in its own job, so the
      # durable flushes (FlushFileBuffers needs write access), the swaps, the recovery and the install run here too.
      - name: CLI · a server's install and update (Windows)
        if: ${{ !cancelled() && env.DAEMON == 'true' && runner.os == 'Windows' }}
        working-directory: packages/cli
        run: bun test test/durable.test.ts test/self-update.test.ts test/plugins-install.test.ts test/server-install.test.ts test/plugin-bun-install.test.ts

      - name: Daemon · build moss-core for ${{ matrix.target }}, and run its --version
        id: daemon-build
        if: ${{ !cancelled() && env.DAEMON == 'true' }}
        run: bun scripts/build-daemon.ts --target ${{ matrix.target }} --smoke

      # verify:sealed-core (the compiled core runs only its own code) runs as the `sealed-core` job, beside this one: its door loop
      # is seven or eight minutes of the machine's fifteen, and it needs only the daemon binary.

      # The built daemon and app are kept only from a manual run (a push to an integration branch skips them too): nothing in a pull request, a
      # merge group or a lane's run downloads them, and the upload costs a runner about 40 s (a macOS one is the queue's bottleneck).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.DAEMON == 'true' && github.event_name == 'workflow_dispatch' }}
        with:
          name: moss-core-${{ matrix.target }}
          path: dist/daemon/${{ matrix.target }}/
          retention-days: 5
          if-no-files-found: error

      # Chromium's sandbox on Linux needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor turns off by
      # default: allowed once, for the headless browser's test and the app's tests alike.
      - name: Chromium's sandbox (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && (env.DAEMON == 'true' || env.APP == 'true') }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The MOSS Browser where no app runs (lane L, plan §4 L M2): the pinned headless shell installed into a temp
      # folder, then a bot's tab, its pictures, the URL rule, the refused DevTools domains, R13 through the real network
      # filter, a stream and a page's window (`packages/core/test/browser/headless-real.test.ts`). The headless shell
      # opens no window.
      - name: Daemon · Headless browser test
        if: ${{ !cancelled() && env.DAEMON == 'true' }}
        working-directory: packages/core
        env:
          MOSS_HEADLESS_TESTS: "1"
        run: bun test test/browser/headless

      - name: App · build the unsigned app
        id: app-build
        if: ${{ !cancelled() && env.APP == 'true' }}
        run: bun run build:app

      # The app's window tests run under xvfb on Linux, directly elsewhere.
      - name: App · UI test
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        working-directory: apps/desktop
        env:
          MOSS_UI_TESTS: "1"
          # The sealed card's tests that press a real button in the main window (apps/desktop/test/sealed-ui.test.ts `onCi`): on for the macOS
          # job. A runner has classic scroll bars (no pointing device), which is the regression test for the sealed page's fit.
          MOSS_SEALED_UI_ON_CI: ${{ runner.os == 'macOS' && '1' || '' }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}bun test test/ui-smoke.test.ts test/sealed-ui.test.ts

      # MOSS, the app for bots (apps/moss, lane MA): built and packaged unsigned and unpacked like MOSS Code, then its
      # window test, headless against its fake engine (the test makes its own test build first).
      - name: App MOSS · build the unsigned app
        id: moss-build
        if: ${{ !cancelled() && env.APP == 'true' }}
        run: bun run build:moss

      - name: App MOSS · UI test
        if: ${{ !cancelled() && steps.moss-build.outcome == 'success' }}
        working-directory: apps/moss
        env:
          MOSS_UI_TESTS: "1"
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}bun test test/ui.test.ts

      # The MOSS Browser in a real Electron (lane L, plan §4 L M1 and M2): offscreen bot tabs, the viewport, the
      # person's selecting and copying through it, the screen-reader hybrid, and the streamed view. CI only, like the
      # UI test.
      - name: App · Browser tests
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        working-directory: apps/desktop
        env:
          MOSS_UI_TESTS: "1"
          # A macOS runner's software VP8 encoder made 2.5 fps once with the machine busy (14 on its other runs; a Mac 10 to 30): the
          # stream step's floor is 5 fps unset, 2 here, which still tells a working stream from a stuck one.
          MOSS_STREAM_MIN_FPS: ${{ runner.os == 'macOS' && '2' || '' }}
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}bun test test/browser.test.ts test/browser-stream.test.ts

      # Lane L-M3: the same fixtures where the display changes. Windows at 150 % and 200 % (a viewport that draws at
      # its frame, agent pictures still 1280x800, points still right); Linux on Wayland under a headless Weston with no
      # X server (offscreen tabs draw, the viewport works, the screen-reader host draws).
      - name: App · Browser test (display scale 1.5, Windows)
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os == 'Windows' }}
        working-directory: apps/desktop
        env:
          MOSS_UI_TESTS: "1"
          MOSS_BROWSER_TEST_SCALE: "1.5"
        run: bun test test/browser.test.ts

      - name: App · Browser test (display scale 2, Windows)
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os == 'Windows' }}
        working-directory: apps/desktop
        env:
          MOSS_UI_TESTS: "1"
          MOSS_BROWSER_TEST_SCALE: "2"
        run: bun test test/browser.test.ts

      - name: App · Browser test (Wayland, headless Weston)
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os == 'Linux' }}
        working-directory: apps/desktop
        env:
          MOSS_UI_TESTS: "1"
          MOSS_BROWSER_TEST_ARGS: "--ozone-platform=wayland"
          MOSS_BROWSER_TEST_WAYLAND: "1"
        run: ../../scripts/ci/weston.sh bun test test/browser.test.ts

      - name: App · Browser stream test (Wayland, headless Weston)
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && runner.os == 'Linux' }}
        working-directory: apps/desktop
        env:
          MOSS_UI_TESTS: "1"
          MOSS_BROWSER_TEST_ARGS: "--ozone-platform=wayland"
        run: ../../scripts/ci/weston.sh bun test test/browser-stream.test.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        with:
          name: moss-app-${{ matrix.target }}
          path: apps/desktop/out/dist/
          retention-days: 5
          if-no-files-found: error

  # The machine job's Windows leg: the same steps (the anchor above), kept out of `lane-gate`.
  machine-windows:
    name: ${{ matrix.target }} (workspaces, daemon, app)
    needs: changes
    if: *machine-if
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest }
    env: *machine-env
    steps: *machine-steps

  # The compiled core runs only its own code (scripts/verify-sealed-core.ts): the daemon binary built for the machine's own
  # target, sealed by build-daemon (scripts/seal-bun-doors.ts), is run with every door Bun has (BUN_BE_BUN, BUN_OPTIONS' preloads,
  # BUN_INSPECT and its connect-out, NODE_PATH and a planted node_modules on the runtime ladder, the working folder's
  # bunfig/.env/tsconfig/package.json, argv) and no payload may run and no debugger may open. On macOS it is signed first as a
  # release signs it (hardened runtime, ad hoc here) and DYLD_INSERT_LIBRARIES is tried. A sequential door loop, left whole: it is a
  # security gate, so it is not parallelised, only run beside the machine job instead of after the daemon's other steps (it
  # built the daemon there and ran seven or eight minutes of its fifteen). Windows is its own job again, for the lane gate.
  sealed-core:
    name: sealed core · ${{ matrix.target }}
    needs: changes
    if: &sealed-if github.event_name != 'pull_request' && needs.changes.outputs.daemon == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    steps: &sealed-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Daemon · build moss-core for ${{ matrix.target }}
        run: bun scripts/build-daemon.ts --target ${{ matrix.target }}

      - name: Daemon · verify:sealed-core
        run: bun scripts/verify-sealed-core.ts --binary dist/daemon/${{ matrix.target }}/moss-core${{ matrix.target == 'windows-x64' && '.exe' || '' }}

  sealed-core-windows:
    name: sealed core · ${{ matrix.target }}
    needs: changes
    if: *sealed-if
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest }
    steps: *sealed-steps

  # A pull request's workspace tests: every workspace package's `test`, as the machine job's step runs it, on linux-x64
  # alone and on a private Secret Service. About two minutes; the other machines, the daemon and the app run in the
  # merge queue (the `machine` job).
  workspaces-pr:
    name: workspaces · linux-x64 (pull request)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.workspaces == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: The private Secret Service's tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-1-0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workspaces · test (on a private Secret Service)
        run: scripts/with-private-secret-service.sh bun scripts/workspaces.ts run test

  # The galleries: every workspace package with a `gallery` script (a plugin's parts, the base theme) builds its
  # gallery and renders each story to PNGs under $MOSS_GALLERY_OUT/<its folder name>, light and dark, with a renderer
  # it brings itself (docs/moss-layout.md). They replace the lanes' own gallery workflows. Linux, so every gallery
  # renders with the same fonts; the PNGs are kept as one artifact for review.
  gallery:
    name: gallery
    needs: changes
    # Not on a pull request: the merge queue and a manual run.
    if: github.event_name != 'pull_request' && needs.changes.outputs.gallery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and render every gallery
        env:
          MOSS_GALLERY_OUT: ${{ runner.temp }}/gallery
        run: bun scripts/workspaces.ts run gallery

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery
          path: ${{ runner.temp }}/gallery
          retention-days: 14
          if-no-files-found: error

  # The Linux packages (plan §4 M1): the deb, the rpm and the AppImage of BOTH apps (MOSS Code and MOSS, the artifact table's
  # files, scripts/release/artifacts.ts) with the daemon inside, for x64 and arm64, each built on its own architecture's
  # machine and opened to check what they hold (scripts/build-packages.ts --check). Then both debs are installed on this
  # runner, checked (`moss` is the daemon's command line, the AppArmor profiles are in, MOSS carries the host) and removed one
  # at a time (the other keeps working); and both rpms are installed and removed the same way in a Fedora container. Nothing
  # is uploaded: the packages are unsigned skeletons until M2.
  packages:
    name: packages · linux-${{ matrix.arch }} (deb, rpm, AppImage)
    needs: changes
    # Not on a pull request: the merge queue and a manual run.
    if: github.event_name != 'pull_request' && needs.changes.outputs.packages == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # One job per architecture, on that architecture's machine: the link sidecar, moss-link, is Rust (with ring's C),
    # and builds for the machine it is on (scripts/build-packages.ts).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, deb: amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/link -> target

      - name: rpmbuild, for the rpm
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and check the packages
        env:
          # The bundled plugins' inputs are checked against the tarballs bun.lock pins (#285): GitHub Packages needs
          # the token to read the @waifucave ones, as for the install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/build-packages.ts --arch ${{ matrix.arch }} --check

      # The folder holds exactly the artifact table's files for this system, both apps (the build checked it; this is the log's proof).
      - name: Every artifact of the table is built, and nothing else
        run: bun scripts/release/check-artifacts.ts --os linux-${{ matrix.arch }}

      # A server on this architecture takes the daemon's release file and the bundled plugins' tarball: the tarball is
      # the tree that daemon embeds the manifest of (#244).
      - name: The bundled plugins' tarball is the tree the daemon's manifest names
        run: |
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          bun scripts/release/check-plugins-tarball.ts "$(ls apps/desktop/out/dist/moss-core-"$version"-linux-*)" "$(ls apps/desktop/out/dist/moss-plugins-"$version"-linux-*.tar.gz)"

      # Both debs on this runner (its architecture): the two apps are two packages with one engine and one `moss` command. Removing
      # one leaves the other working (spec §3.1), and no file is in both packages (dpkg would refuse the second install).
      - name: Install both debs, check them, and remove them one at a time
        run: |
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          code=apps/desktop/out/dist/moss-code_${version}_${{ matrix.deb }}.deb
          moss=apps/desktop/out/dist/moss_${version}_${{ matrix.deb }}.deb
          test "$(dpkg-deb -f "$code" Package)" = moss-code
          test "$(dpkg-deb -f "$moss" Package)" = moss
          # No regular file in both packages.
          files() { dpkg-deb -c "$1" | awk '$1 !~ /^d/ {print $6}' | sort; }
          test -z "$(comm -12 <(files "$code") <(files "$moss"))" || { echo "::error::a file is in both packages"; comm -12 <(files "$code") <(files "$moss"); exit 1; }
          sudo apt-get install -y -qq "./$code" "./$moss"
          for root in /opt/moss-code /opt/moss; do
            test -x $root/resources/daemon/moss-link
            test "$(cat $root/resources/daemon/install.json)" = '{"kind":"package"}'
          done
          test -x /opt/moss-code/moss-code
          test -x /opt/moss/moss-app
          test -f /etc/apparmor.d/moss-code
          test -f /etc/apparmor.d/moss-app
          # MOSS carries the host: MOSS Code's app, with MOSS Code's own app.asar, and the host's profile for it.
          test -x /opt/moss/resources/host/moss-host
          cmp /opt/moss/resources/host/resources/app.asar /opt/moss-code/resources/app.asar
          grep -q 'profile moss-app-host /opt/moss/resources/host/moss-host' /etc/apparmor.d/moss-app
          case "$(readlink -f /usr/bin/moss)" in /opt/moss-code/resources/daemon/moss-core|/opt/moss/resources/daemon/moss-core) ;; *) echo "::error::moss is not a daemon of ours"; exit 1;; esac
          MOSS_HOME="$(mktemp -d)" moss --version
          # Removing MOSS leaves MOSS Code, its `moss` command and its profile working.
          sudo apt-get remove -y -qq moss
          test ! -e /opt/moss/resources/daemon/install.json
          test ! -e /etc/apparmor.d/moss-app
          test "$(readlink -f /usr/bin/moss)" = /opt/moss-code/resources/daemon/moss-core
          MOSS_HOME="$(mktemp -d)" moss --version
          test -f /etc/apparmor.d/moss-code
          test "$(cat /opt/moss-code/resources/daemon/install.json)" = '{"kind":"package"}'
          sudo apt-get remove -y -qq moss-code
          test ! -e /opt/moss-code/resources/daemon/install.json
          test ! -e /usr/bin/moss
          test ! -e /etc/apparmor.d/moss-code
          # And the other way round: MOSS Code first.
          sudo apt-get install -y -qq "./$code" "./$moss"
          sudo apt-get remove -y -qq moss-code
          test "$(readlink -f /usr/bin/moss)" = /opt/moss/resources/daemon/moss-core
          MOSS_HOME="$(mktemp -d)" moss --version
          sudo apt-get remove -y -qq moss
          test ! -e /usr/bin/moss
          test ! -e /etc/apparmor.d/moss-app

      # Both rpms in a Fedora container (the runner has docker): installed, `moss` answers, removed one at a time.
      - name: Install both rpms in Fedora, check them, and remove them one at a time
        run: |
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          rpmarch=${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
          docker run --rm -v "$PWD/apps/desktop/out/dist:/pkg:ro" fedora:42 bash -euxc '
            dnf install -y -q /pkg/moss-code-'"$version"'.'"$rpmarch"'.rpm /pkg/moss-'"$version"'.'"$rpmarch"'.rpm
            test -x /opt/moss-code/moss-code && test -x /opt/moss/moss-app && test -x /opt/moss/resources/host/moss-host
            MOSS_HOME="$(mktemp -d)" moss --version
            rpm -e moss
            # rpm leaves a directory it did not list; what matters is that no file or link of the app is left.
            test -z "$(find /opt/moss ! -type d 2>/dev/null)" || { find /opt/moss ! -type d | head; exit 1; }
            MOSS_HOME="$(mktemp -d)" moss --version
            rpm -e moss-code
            # rpm leaves a directory it did not list; what matters is that no file or link of the app is left.
            test -z "$(find /opt/moss-code ! -type d 2>/dev/null)" || { find /opt/moss-code ! -type d | head; exit 1; }
            test ! -e /usr/bin/moss'

  # The macOS and Windows installers (plan §4 M-M2): the release build itself, unsigned (scripts/release/build.ts), so
  # each PR that touches them shows they still build: the dmg and its update zip on Apple silicon, the NSIS installer
  # on Windows, each with its update files and the daemon's own (moss-core-<version>-<target> and its update file),
  # every one checked against the files it names. Nothing is signed, uploaded or published.
  installers:
    name: installers · ${{ matrix.os }} (${{ matrix.what }})
    needs: changes
    # Not on a pull request: the merge queue and a manual run.
    if: &installers-if github.event_name != 'pull_request' && needs.changes.outputs.installers == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The macOS installer here, the Windows one in `installers-windows` (kept out of `lane-gate`): the job runs in the
      # merge queue and on a manual run only (a pull request takes none).
      matrix:
        include:
          - { os: mac, runner: macos-latest, what: "dmg, zip" }
    steps: &installers-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/link -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installers (unsigned) and check them
        shell: bash
        env:
          # The bundled plugins' inputs are checked against the tarballs bun.lock pins (#285): GitHub Packages needs
          # the token to read the @waifucave ones, as for the install.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/release/build.ts --channel latest
          ls -l apps/desktop/out/dist

      # The daemon's release file answers `--version` in the environment a server's self-update gives it
      # (packages/cli/src/self-update.ts's versionEnv): PATH alone, and on Windows SystemRoot and windir too.
      - name: The daemon's release file answers --version as its self-update runs it
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          bin=$(ls apps/desktop/out/dist/moss-core-"$version"-*)
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then extra=(SystemRoot="${SYSTEMROOT:-$SystemRoot}" windir="${WINDIR:-$windir}"); fi
          said=$(env -i PATH="$PATH" "${extra[@]}" "$bin" --version)
          echo "$bin --version: $said"
          test "$said" = "moss $version"

      # The bundled plugins' tarball for a server is the tree that daemon embeds the manifest of (#244), as the daemon
      # itself reports it, run as a server's self-update runs it.
      - name: The bundled plugins' tarball is the tree the daemon's manifest names
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./apps/desktop/package.json").version)')
          bun scripts/release/check-plugins-tarball.ts "$(ls apps/desktop/out/dist/moss-core-"$version"-*)" "$(ls apps/desktop/out/dist/moss-plugins-"$version"-*.tar.gz)"

      # The folder holds exactly the artifact table's files for this system: both apps' installers and update files, and the
      # engine's (the build checked it at its end; this is the log's proof, and the same check the release workflow runs).
      - name: Every artifact of the table is built, and nothing else
        shell: bash
        run: bun scripts/release/check-artifacts.ts --os ${{ matrix.os }}

      # Both apps installed from what was built, checked and removed (scripts/release/install-check.ts): the dmgs mounted read-only
      # and their apps copied out on macOS, the NSIS installers run silently on Windows, removing MOSS first and then MOSS Code.
      - name: Install both apps, check them, and remove them
        shell: bash
        run: bun scripts/release/install-check.ts ${{ matrix.os }}

  installers-windows:
    name: installers · ${{ matrix.os }} (${{ matrix.what }})
    needs: changes
    if: *installers-if
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: win, runner: windows-latest, what: NSIS }
    steps: *installers-steps

  # The tree and the computers (J-M1) on Linux and Windows: the core's tree and computers tests, with lane B's
  # conformance suites run against the real code, and several computers on the fake link. macOS runs them in the core
  # suite (the macos job), so this job is the other two OSes' only run of them. It was spike-s6.yml's `tree` job (R6).
  tree:
    name: tree · ${{ matrix.runner }}
    needs: changes
    # Not on a pull request: the merge queue and a manual run.
    if: &tree-if github.event_name != 'pull_request' && needs.changes.outputs.tree == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    defaults: &tree-defaults
      run:
        shell: bash
    steps: &tree-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The tree and the computers, with lane B's conformance suites
        working-directory: packages/core
        run: bun test --timeout 30000 test/tree test/computers src/contracts/tests/tree.test.ts src/contracts/tests/computer-registry.test.ts

      - name: An agent backend's bare command on PATH (its .exe or .cmd on Windows)
        working-directory: packages/core
        run: bun test --timeout 30000 src/agents/tests/windows-path.test.ts

      # The secrets file on Windows (lane SF, spec §9.1): the real Credential Manager holds the file's key (a throwaway
      # service the test makes and removes), the file's ACL is read back from icacls, and the writers of several processes
      # share the file's lock. Linux runs the same files in `core-linux`, on a private Secret Service.
      - name: The secrets file, its key in Credential Manager (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/core
        run: bun test --timeout 60000 test/secrets test/fence/secrets-file-fence.test.ts

  tree-windows:
    name: tree · ${{ matrix.runner }}
    needs: changes
    if: *tree-if
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    defaults: *tree-defaults
    steps: *tree-steps

  # Windows Bash and PowerShell under MOSS's fence (lane WS; spec §4, §14.1 item 2), on windows-latest: the Windows
  # fence's unit tests, and setup, a bot's Bash and PowerShell and the node's Bash fenced for real, and remove
  # (.github/workflows/windows-fence.yml). Like the other Windows jobs: not on a pull request, and not in the lane gate.
  # When the fence guard runs (below), its end-to-end job is that one's, not run twice.
  windows-fence:
    name: windows fence
    needs: changes
    if: github.event_name != 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.windows == 'true')
    uses: ./.github/workflows/windows-fence.yml
    with:
      skip_e2e: ${{ needs.changes.outputs.fenceguard == 'true' }}

  # The fence's guard IN the lane gate (lane WS11): for a change to the fence, the approval checks or the Windows launcher's sources,
  # the windows-fence end-to-end job alone (the fence for real, the share refusal's guard, every refusal against a positive control),
  # so a change that weakens the fence cannot reach an integration branch on a green lane gate. Not on a pull request.
  windows-fence-guard:
    name: windows fence guard
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.fenceguard == 'true'
    uses: ./.github/workflows/windows-fence.yml
    with:
      only: e2e

  # The link sidecar (native/link, lane H's moss-link, iroh) on Windows and Linux, x64 and arm64: it is built, and
  # the core's link tests run over it on loopback (src/links/tests/sidecar.test.ts: pairing, a request, a 3 MiB
  # stream, a revoke, a key the core didn't allow). Nothing leaves the runner: the relay is off and the endpoints bind
  # 127.0.0.1. macOS runs the same in the macos job, which keeps the macOS jobs a change takes to three. It was
  # link.yml's `sidecar` job.
  link:
    name: link · ${{ matrix.runner }}
    needs: changes
    # Not on a pull request: the merge queue and a manual run.
    if: &link-if github.event_name != 'pull_request' && needs.changes.outputs.link == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    defaults: &link-defaults
      run:
        shell: bash
    steps: &link-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/link -> target

      - name: Build moss-link
        run: cargo build --release --locked --manifest-path native/link/Cargo.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The link tests over the sidecar
        working-directory: packages/core
        env:
          MOSS_LINK_BIN: ${{ github.workspace }}/native/link/target/release/moss-link${{ runner.os == 'Windows' && '.exe' || '' }}
          MOSS_LINK_REQUIRE_BINARY: "1"
        run: bun test --timeout 60000 src/links

  link-windows:
    name: link · ${{ matrix.runner }}
    needs: changes
    if: *link-if
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    defaults: *link-defaults
    steps: *link-steps

  # The Linux repositories' signatures against the verifiers users run: a throwaway key signs a fixture Release and
  # repomd.xml as `linux-repo.ts sign` does, and gpgv and sqv must accept them and refuse a changed one.
  # Three distributions' verifiers: the runner's Ubuntu 24.04, Debian trixie and Ubuntu 26.04 (as containers, each
  # pinned by its image index digest; a bump is a reviewed change like any action's pin).
  linux-repo-signatures:
    name: linux repositories · signatures · ${{ matrix.os }}
    needs: changes
    # Not on a pull request: the merge queue and a manual run.
    if: github.event_name != 'pull_request' && needs.changes.outputs.linuxrepo == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, runner: ubuntu-24.04, container: "" }
          - { os: debian-trixie, runner: ubuntu-24.04, container: "debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6" }
          - { os: ubuntu-26.04, runner: ubuntu-24.04, container: "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c" }
    steps:
      # Before the checkout and Bun: in a bare container, setup-bun needs unzip and the downloads need CA certificates.
      - name: gpgv, sqv and apt-ftparchive
        run: |
          if [ "$(id -u)" = 0 ]; then SUDO=; else SUDO=sudo; fi
          $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq --no-install-recommends gpgv sqv apt-utils ca-certificates unzip
          gpgv --version | head -1; sqv --version; apt-get --version | head -1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The signatures verify with gpgv and sqv, and apt-get update takes the signed repository
        run: bun scripts/release/linux-repo-verify.ts

  # The REAL pinned agent adapters (plugins' `launch.adapter`: Claude Code's and Codex's), the proof nothing on a person's
  # machine runs: each is fetched from the public npm registry through the same code the card's yes takes (every hash checked
  # before unpacking), started on the pinned Bun with the flags and environment the engine uses (`--no-install`, so a module
  # the lock lacks fails here, not for a person who said yes), and spoken to over ACP: `initialize` must come back. The
  # person's `claude` and `codex` are stand-ins that record they were reached. GitHub only (the switch is set here, and a
  # person's machine downloads nothing without a yes); the macOS leg is a step of the `macos` job. Not on a pull request.
  agent-adapters:
    name: agent adapters · ${{ matrix.runner }}
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.adapters == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The real adapters start on Bun and answer initialize
        working-directory: packages/core
        env:
          MOSS_REAL_ADAPTERS: "1"
        run: bun test ./src/agents/tests/adapter-real.proof.ts --timeout 600000

  # P8b-9: `bun test` does not typecheck — bun strips types and runs, so a compile error in a project nobody
  # compiles is not a tripwire (the protocol checklist's step 4 trap, `satisfies Record<SessionEvent["type"],
  # boolean>`, fails core's tsc when a `SessionEvent` variant is added). `bun run typecheck` is every workspace
  # package's own `typecheck` (core, cli, protocol, plugin-sdk, the test harness, the app, the services: each
  # named in the log as it runs), the page runtime and the repo's scripts.
  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

  # The two lockfiles agree with the manifests: bun.lock (the install above every job fails on drift) and
  # pnpm-lock.yaml, which the pnpm scripts and the browser extension use. Resolution only: nothing installed.
  lockfiles:
    name: lockfiles
    needs: changes
    if: needs.changes.outputs.lockfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: bun.lock
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: pnpm-lock.yaml
        run: npx --yes pnpm@10.33.0 install --frozen-lockfile --lockfile-only
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Winter for Chrome (extensions/winter-for-chrome): the MV3 extension's typecheck and its unit tests (the CDP guard,
  # the controller over a fake browser, the native port, the manifest and the build — which renders the icons with the
  # workspace's resvg and fails on any call that would move the user's view). It is not a pnpm/bun package anything
  # imports, so it has its own job.
  test-extension:
    name: test · winter-for-chrome
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        working-directory: extensions/winter-for-chrome
        run: ../../node_modules/.bin/tsc --noEmit -p .

      - name: Test
        working-directory: extensions/winter-for-chrome
        run: bun test

  # P9a-8: the `winter-binary` job (P8b-2: build the `winter` binary from the pinned-tag SDK
  # checkout, upload it as an artifact, every consumer downloads it) is DELETED — its ONLY source is the installed
  # npm platform package (`@yanlinglabs/winter-agent-sdk-darwin-arm64`, an optional dependency of
  # the wrapper that `bun install` resolves on darwin-arm64; published at v0.0.5). The 0.0.5 pin
  # flip removed the dated checkout+build fallback blocks and the `versions` job they consumed;
  # each job that needs the `winter` binary now FAILS LOUDLY if the package did not install.

  # The jobs that need the agent runtime's darwin-arm64 binary, as steps of ONE macOS job, each run only when this
  # change needs it, and each still run after an earlier one fails, so one run reports them all:
  #  - core's suite and cli's non-TUI tests (`test/*.ts` only — `test/tui/**` renders the Ink transcript through
  #    ink-testing-library and has ~30 pre-existing failures on main; widen back to a bare `bun test` the moment that
  #    suite is fixed). Their package.json says `mossCi.ownJob`, so the other packages' tests stay independent of
  #    the `winter` binary: a broken platform package must not hold them up. MOSS_RUNTIME_REQUIRE_BINARY=1 is the
  #    point of the binary: without it, every test that needs a real `winter` child SKIPS (core's real-child projector
  #    test, cli's session tests in client.test.ts), and CI would go green by proving nothing. Since A-M1 core's session
  #    tests run on the embedded runtime; those two still spawn the binary.
  #  - the repo's own scripts' tests (`scripts/**/*.test.ts`): the layout's conventions, the build, dev and release
  #    tools' pure halves, the held scripts, the limiter, the rename's codemod. None builds an app or starts a
  #    daemon. `embed-runtimes.darwin.test.ts` stages the agent runtime's binary from dist/.
  #  - the compiled-binary proofs (Winter Phase 8d, P8d-5): verify:workflow, verify:automation-worker,
  #    verify:runtime-state, verify:fd-receiver and verify:runtimes, which resolves the `winter` binary through its
  #    own ladder (the installed platform package first).
  # One job, not four, so the macOS runners are taken once per change.
  #
  # In three legs, so the core's macOS tests (11 minutes on one runner) take about four each: every leg runs a third of
  # them (scripts/platform-tests.ts --shard), leg 1 adds the CLI's tests, the scripts' macOS tests and the compiled-binary
  # proofs, leg 2 the link sidecar's build and tests (`parts` says which). A leg whose parts this change doesn't take
  # still installs and takes its third of the core's tests when the core changed.
  macos:
    name: macOS (core, cli, scripts, verify, link) ${{ matrix.shard }}/3
    needs: changes
    # Not on a pull request: the lane runs it on its own Mac (the local gate); the merge queue runs it here.
    if: github.event_name != 'pull_request' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.scriptsmac == 'true' || needs.changes.outputs.verify == 'true' || needs.changes.outputs.link == 'true' || needs.changes.outputs.adapters == 'true')
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, parts: "cli scripts verify" }
          - { shard: 2, parts: "link" }
          - { shard: 3, parts: "" }
    env:
      CORE: ${{ needs.changes.outputs.core }}
      CLI: ${{ needs.changes.outputs.cli == 'true' && contains(matrix.parts, 'cli') }}
      SCRIPTS: ${{ needs.changes.outputs.scriptsmac == 'true' && contains(matrix.parts, 'scripts') }}
      VERIFY: ${{ needs.changes.outputs.verify == 'true' && contains(matrix.parts, 'verify') }}
      LINK: ${{ needs.changes.outputs.link == 'true' && contains(matrix.parts, 'link') }}
      ADAPTERS: ${{ needs.changes.outputs.adapters == 'true' && matrix.shard == 3 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The link job's macOS leg (link: moss-link built, the core's link tests over it).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; the version is RUST_TOOLCHAIN
        if: env.LINK == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.LINK == 'true'
        with:
          workspaces: native/link -> target

      - name: Build moss-link
        if: env.LINK == 'true'
        run: cargo build --release --locked --manifest-path native/link/Cargo.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # P9a-8: `bun install` above must have brought the winter platform package (the same
      # dual-hop resolver the daemon's ladder uses); absent = a loud failure, never a fallback.
      - name: Check for the installed winter platform package (P9a-8)
        id: moss-package
        working-directory: packages/core
        run: |
          BIN=$(bun -e '
          import { resolvePlatformPackageWinter } from "./src/runtime-sdk/executable";
          console.log(resolvePlatformPackageWinter() ?? "");
          ')
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          if [ -n "$BIN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::error::the winter platform package (@yanlinglabs/winter-agent-sdk-darwin-arm64 at REQUIRED_WINTER_AGENT_SDK) did not install — bun install is the ONLY winter source since the 0.0.5 pin flip (P9a-8)"; exit 1; fi

      - name: Use the installed platform package's winter binary (P9a-8 — the strong row-16 path)
        run: |
          mkdir -p dist
          cp "${{ steps.moss-package.outputs.bin }}" dist/winter
          chmod +x dist/winter

      # Only the core's macOS tests: the files named *.darwin.test.ts and the mixed ones that mark theirs with
      # darwinTest/darwinDescribe (test/helpers/darwin-only.ts). Everything else runs on Linux, in core-linux's shards
      # (scripts/platform-tests.ts picks each side's files; a clear Bun crash, exit 133 or a signal with no summary, is
      # re-run once with a ::warning::).
      # The per-test timeout here and in core-linux's shards is 20 s, not bun's 5 s: an overloaded runner (the merge
      # queue's Macs above all) took a test that runs in well under a second locally past 5 s and dropped a PR from the
      # queue for it. Local runs keep the 5 s, so a test that is slow for real still shows there; each run prints its
      # 10 slowest tests (--slowest), so one creeping toward the limit is seen before it fails.
      - name: Core · the macOS tests
        if: env.CORE == 'true'
        env:
          MOSS_RUNTIME_EXECUTABLE: ${{ github.workspace }}/dist/winter
          MOSS_RUNTIME_REQUIRE_BINARY: "1"
        run: bun scripts/platform-tests.ts --root packages/core --cwd packages/core --darwin --shard ${{ matrix.shard }}/3 --timeout 20000 --slowest 10

      - name: CLI · test
        if: ${{ !cancelled() && env.CLI == 'true' }}
        working-directory: packages/cli
        env:
          MOSS_RUNTIME_EXECUTABLE: ${{ github.workspace }}/dist/winter
          MOSS_RUNTIME_REQUIRE_BINARY: "1"
        # 20 s per test, as the core's shards (see "Core · the macOS tests").
        run: bun test --timeout 20000 test/*.ts

      # Only the repo scripts' macOS tests (`scripts/**/*.darwin.test.ts`: codesign, the predecessor app's bundles,
      # LaunchServices); the rest run on Linux, in the scripts job.
      - name: Scripts · the macOS-only tests
        if: ${{ !cancelled() && env.SCRIPTS == 'true' }}
        # embed-runtimes stages dist/winter (copied above): required here, skipped only in a plain local run.
        env:
          MOSS_RUNTIME_REQUIRE_BINARY: "1"
        # 20 s a test, as the core's jobs: a cold runner's first `clang` took one of these past bun's 5 s default (the
        # embed-cowork-native test, which then read the killed child's null status as a failed build).
        run: bun scripts/platform-tests.ts --root scripts --darwin --timeout 20000

      # The real pinned agent adapters on this arm64 Mac (the `agent adapters` job's proof; an optional platform package is
      # what differs per platform): fetched from the public registry, started on Bun with --no-install, initialize answered.
      - name: Agent adapters · the real ones start on Bun and answer initialize
        if: ${{ !cancelled() && env.ADAPTERS == 'true' }}
        working-directory: packages/core
        env:
          MOSS_REAL_ADAPTERS: "1"
        run: bun test ./src/agents/tests/adapter-real.proof.ts --timeout 600000

      - name: Link · the link tests over the sidecar
        if: ${{ !cancelled() && env.LINK == 'true' }}
        working-directory: packages/core
        env:
          MOSS_LINK_BIN: ${{ github.workspace }}/native/link/target/release/moss-link
          MOSS_LINK_REQUIRE_BINARY: "1"
        run: bun test --timeout 60000 src/links

      - name: verify:workflow
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:workflow

      # The ComputerV2 worker is the whole binary under its own seatbelt and a `{ PATH }`-only
      # environment: a module that throws at load there (2026-10-19, a load-time homedir()) takes
      # every ComputerV2 call down while verify:workflow, with its own profile, still passes.
      - name: verify:automation-worker
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:automation-worker

      - name: verify:runtime-state
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:runtime-state

      # N2 S7B: the Cowork native pair's packaging gate. Builds the real launcher (swift build, scratch path), embeds it with a stand-in worker into a
      # scratch bundle (ad hoc), accepts it and proves seven refusals. Never runs either binary, never signs with a real identity.
      - name: verify:cowork-native
        # Cowork is paused (spec §12): this runs on demand only (workflow_dispatch).
        if: ${{ !cancelled() && env.VERIFY == 'true' && github.event_name == 'workflow_dispatch' }}
        run: bun run verify:cowork-native

      # N2 S7B: the Cowork channel's receiver thread must start in the COMPILED daemon (a third compile:core entrypoint). Compiles moss-core and runs a temp copy's
      # probe on a socketpair; touches no home, Keychain, daemon or launcher.
      - name: verify:fd-receiver
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:fd-receiver

      # WS-23 (fix round 1, minor 6): the vendored ant, pinned and checksum-verified by fetch-ant
      # itself, so verify:runtimes exercises ant's bundle rung and its record's SHA against the pin
      # rather than skipping them.
      - name: Fetch the pinned ant
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run scripts/fetch-ant.ts

      - name: verify:runtimes
        if: ${{ !cancelled() && env.VERIFY == 'true' }}
        run: bun run verify:runtimes

  # The core suite on Linux, in three shards: every test file but the macOS ones (*.darwin.test.ts), with the mixed
  # files' darwinTest/darwinDescribe tests skipping. On a private Secret Service (the OS secret store the harness's
  # throwaway stores use), with bubblewrap for the Bash fence and a git identity for the tests' throwaway repos.
  # packages/core/test/platform-ci.json holds the reviewed lists: Linux product bugs the shards skip until fixed (shard
  # 1 runs each and fails if one now passes), the skips Linux may show, and the darwin mentions that gate nothing.
  core-linux:
    name: core · linux ${{ matrix.shard }}/3
    needs: changes
    # `core`: the core's sources and what its macOS tests read (the macOS legs run too); `corelinux`: what only these Linux shards read.
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.corelinux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GIT_AUTHOR_NAME: MOSS CI
      GIT_AUTHOR_EMAIL: ci@moss.invalid
      GIT_COMMITTER_NAME: MOSS CI
      GIT_COMMITTER_EMAIL: ci@moss.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: The private Secret Service's tools, and bubblewrap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-1-0 bubblewrap socat libsecret-tools libsecret-1-dev libglib2.0-dev pkg-config gcc
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The credential broker's e2e (test/fence/linux-secret-broker.e2e.test.ts, docs/linux-credential-broker.md) runs
      # real clients inside the fence: git's libsecret helper, built here from the source the git package ships (Ubuntu
      # ships no binary of it), secret-tool, busctl, systemd-run and the runner's own gh. MOSS_BROKER_E2E makes a missing
      # one fail the test instead of skipping it.
      - name: git's libsecret credential helper
        run: |
          src="$(ls /usr/share/doc/git/contrib/credential/libsecret/git-credential-libsecret.c* | head -1)"
          zcat -f "$src" > "$RUNNER_TEMP/git-credential-libsecret.c"
          gcc -O2 -o "$RUNNER_TEMP/git-credential-libsecret" "$RUNNER_TEMP/git-credential-libsecret.c" $(pkg-config --cflags --libs libsecret-1 glib-2.0)
          echo "MOSS_GIT_CREDENTIAL_LIBSECRET=$RUNNER_TEMP/git-credential-libsecret" >> "$GITHUB_ENV"
          echo "MOSS_BROKER_E2E=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Core · test
        run: scripts/with-private-secret-service.sh bun scripts/platform-tests.ts --root packages/core --cwd packages/core --not-darwin --shard ${{ matrix.shard }}/3 --config packages/core/test/platform-ci.json --timeout 20000 --slowest 10 ${{ matrix.shard == 1 && '--check-known-failures' || '' }}

  # The repo scripts' tests (`scripts/**/*.test.ts`) on Linux: the layout's conventions, the build, dev and release
  # tools' pure halves, the held scripts, the limiter, the rename's codemod. The few that need macOS are named
  # `*.darwin.test.ts` and run in the macos job (scripts/platform-tests.ts picks each side's files).
  scripts:
    name: scripts · linux
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # xmllint, for release-lib's appcast checks, and bsdtar (libarchive-tools), which the name scan opens zips, tars,
      # debs and rpms with and its tests build their fixtures with. macOS has both built in. The scan itself runs only
      # in publish.ts on the owner's Mac, so this changes no release behaviour: Linux CI gets the same bsdtar the Mac has.
      - name: xmllint and bsdtar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxml2-utils libarchive-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scripts · test
        run: bun scripts/platform-tests.ts --root scripts --not-darwin --timeout 20000

      # The repo-wide source scans, which read every package's src/ and scripts/ (the native channel's anti-wiring
      # test): they run here for any such change, not only when the core's own shards do.
      - name: Source scans · anti-wiring
        working-directory: packages/core
        run: bun test test/cowork/native/anti-wiring.test.ts

  # The protocol package generates a JSON schema and its fixtures. If a schema
  # change landed without re-running the generator, the tree is dirty here — which is exactly the
  # drift the checklist in CONTRIBUTING.md exists to prevent.
  protocol-codegen:
    name: protocol codegen is committed
    needs: changes
    if: needs.changes.outputs.codegen == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate
        working-directory: packages/protocol
        run: bun run generate

      - name: Fail if the generated output differs from what is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated protocol artifacts are out of date. Run 'pnpm protocol:generate' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  # The acceptance run (scripts/acceptance/run.ts): the real app driven from source, headless, over the fake model provider,
  # on a macOS runner, one job per unit (scripts/acceptance/shards.ts: `chain` is what shares step 4's plugin and the first
  # daemon's state, `window-1` to `window-3` the window's steps, each from a fresh home; the others are rows that need only a
  # keyed daemon and an app; `--units main` locally runs the chain and the three windows in one home). It is what a lane's integration branch has to pass besides the
  # suites, so it runs on a push to an integration branch and on a manual run, never on a pull request or in the merge
  # queue (the `gate` does not wait for it). scripts/ci/acceptance-unit.ts runs a unit and fails it on any row that is not
  # PASS, on any "shown while headless" line and on a nonzero "sealed presses refused as covered or unchecked"; the table,
  # the progress and the kept logs are the job's artifact. A hosted runner has no pinned-Bun cache and no Electron cache:
  # setup-bun gives the pinned Bun (so heavy needs no pinned-bun, MOSS_PINNED_BUN=0), and Electron's download is cached
  # under the lockfile. scripts/heavy's exclusive lock is free on a fresh runner and is taken as on a Mac.
  acceptance:
    name: acceptance · ${{ matrix.unit }}
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.inputs.only != 'acceptance-linux' && github.event.inputs.only != 'acceptance-windows' && needs.changes.outputs.acceptance == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The units this run needs (scripts/ci-changes.ts: every unit on a push to an integration branch and a full or acceptance-only
        # manual run, the units the change touches on a scoped one). THE list a new unit is added to is `ON_GITHUB` in
        # scripts/ci/acceptance-units.ts (which also says what stays off it, and why).
        unit: ${{ fromJSON(needs.changes.outputs.acceptance_units) }}
    env:
      MOSS_PINNED_BUN: "0"
      # Row 37 counts a hidden page's 100 ms ticks over 3 s (30 on a free machine, about 3 when throttled; the bar is 20): a shared runner
      # can starve the page, so the bar here is 10, still well above a throttled page.
      MOSS_ACCEPT_TICK_MIN: "10"
      # Every "not within N s" wait of the run takes this many times as long (scripts/acceptance/time-scale.ts; a Mac keeps 1): a
      # shared runner is several times slower than the machine the waits were set on, and its speed moves from run to run. A
      # unit runs once (scripts/ci/acceptance-unit.ts), so the one run is the patient one.
      MOSS_ACCEPT_TIME_SCALE: "3"
      # The rows whose bar is a measured CPU share or message rate say "MEASURED ON THE MAC ONLY" instead (scripts/acceptance/measured.ts):
      # a runner's load decides those numbers, so the Mac's merge check measures them.
      MOSS_ACCEPT_MEASURE: "mac-only"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The Electron binary the app runs on (electron's install.js downloads it, which bun's install does not run): restored
      # here, and saved after the run even when a row failed (the cache action's own post step saves only a passing job).
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: electron
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Acceptance · ${{ matrix.unit }}
        run: bun scripts/ci/acceptance-unit.ts ${{ matrix.unit }} "$RUNNER_TEMP/acceptance-${{ matrix.unit }}"

      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: ${{ !cancelled() && steps.electron.outputs.cache-hit != 'true' }}
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-${{ matrix.unit }}
          path: ${{ runner.temp }}/acceptance-${{ matrix.unit }}
          retention-days: 7
          if-no-files-found: warn

  # The acceptance run on Linux (lane LX): the same harness and the same units as `acceptance` above, from source, on ubuntu-24.04
  # under xvfb, with the private Secret Service the Linux tests use (scripts/with-private-secret-service.sh). NOT a part of the
  # lane gate or the gate (neither needs it: a unit that is red here does not turn another lane's run red), and never on a pull
  # request, a merge group or a push: a manual run only. Each unit's rows are PASS, or say "not on Linux: <reason>"
  # (scripts/acceptance/not-on-linux.ts), or the unit is red, which is the list of what a person on Linux would meet.
  acceptance-linux:
    name: acceptance-linux · ${{ matrix.unit }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only != 'acceptance-windows' && needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.changes.outputs.acceptance_units) }}
    env:
      MOSS_PINNED_BUN: "0"
      MOSS_ACCEPT_TICK_MIN: "10"
      MOSS_ACCEPT_TIME_SCALE: "3"
      MOSS_ACCEPT_MEASURE: "mac-only"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # bubblewrap and socat: the Bash fence of a bot's turn on Linux (fence/linux-bwrap.ts); x11-utils: the harness's list of the windows
      # on the display (host-step.ts), where macOS reads the window server.
      - name: The private Secret Service's tools, the fence's, and the display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-1-0 xvfb xauth x11-utils bubblewrap socat

      # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor turns off by default (as the machine job does).
      - name: Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: electron
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Acceptance on Linux · ${{ matrix.unit }}
        # No window manager on purpose: the window rows are written for a window that is not focused or shown (offscreen), and a manager
        # focuses and places it (run 45209149315: window-2's reload row saw a different tab with one).
        run: xvfb-run -a scripts/with-private-secret-service.sh bun scripts/ci/acceptance-unit.ts ${{ matrix.unit }} "$RUNNER_TEMP/acceptance-linux-${{ matrix.unit }}"

      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: ${{ !cancelled() && steps.electron.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-linux-${{ matrix.unit }}
          path: ${{ runner.temp }}/acceptance-linux-${{ matrix.unit }}
          retention-days: 7
          if-no-files-found: warn

  # The acceptance run on Windows (lane WA): the same harness and the same units as `acceptance` above, from source, on windows-latest.
  # NOT a part of the lane gate or the gate, never on a pull request, a merge group or a push: a manual run only (as
  # `acceptance-linux`). The engine's secrets are a throwaway Credential Manager service (test-isolation.ts), its endpoint a named
  # pipe. The units that need no window come first; a window unit needs the runner's interactive desktop session (the runner's job
  # runs in one) or an offscreen app. A row says "not on Windows: <reason>" (scripts/acceptance/not-on-windows.ts) or the unit is red.
  acceptance-windows:
    name: acceptance-windows · ${{ matrix.unit }}
    needs: changes
    # Only when asked (`scripts/ci/lane start --only acceptance-windows`) until its units are green: twelve of them are red for an hour each, and an
    # ordinary lane run must not spend its Windows runners on them. TO FLIP when they are green: drop the `only == 'acceptance-windows'` test here (the
    # job then joins every ordinary run, as `acceptance-linux` does), restore `!= 'acceptance-windows'` on nothing, and say so in scripts/ci/lane's help.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'acceptance-windows' && needs.changes.outputs.acceptance == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.changes.outputs.acceptance_units) }}
    defaults:
      run:
        shell: bash
    env:
      MOSS_PINNED_BUN: "0"
      MOSS_ACCEPT_TICK_MIN: "10"
      MOSS_ACCEPT_TIME_SCALE: "3"
      MOSS_ACCEPT_MEASURE: "mac-only"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # MOSS's coding agent on Windows starts only once `moss-core sandbox setup` has been run (the fence's pool of principals and its launcher), as the
      # windows-fence workflow's e2e job runs it. The units that never start an agent skip it.
      - name: Windows fence for the agent · build srt-win from the pinned source
        if: ${{ !contains(fromJSON('["models","archive","browser-host","host"]'), matrix.unit) }}
        shell: pwsh
        run: scripts/ci/windows-fence/build-launcher.ps1

      - name: Windows fence for the agent · build moss-core.exe
        if: ${{ !contains(fromJSON('["models","archive","browser-host","host"]'), matrix.unit) }}
        # (the build downloads the pinned bun: GitHub's release host answers 503 now and then, so it is tried three times)
        shell: bash
        run: for i in 1 2 3; do bun scripts/build-daemon.ts --target windows-x64 && exit 0; sleep 20; done; exit 1

      - name: Windows fence for the agent · sandbox setup, from the protected copy
        if: ${{ !contains(fromJSON('["models","archive","browser-host","host"]'), matrix.unit) }}
        timeout-minutes: 40
        shell: pwsh
        run: scripts/ci/windows-fence/setup.ps1

      - name: Acceptance on Windows · ${{ matrix.unit }}
        run: bun scripts/ci/acceptance-unit.ts ${{ matrix.unit }} "$RUNNER_TEMP/acceptance-windows-${{ matrix.unit }}"

      # What the plugin host's own tests say on this runner, beside the unit (the host exited at once in the unit's first runs).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: acceptance-windows-${{ matrix.unit }}
          path: ${{ runner.temp }}/acceptance-windows-${{ matrix.unit }}
          retention-days: 7
          if-no-files-found: warn

  # The lane gate: what a lane's run has to pass. The same check as `gate`, over every job but the Windows ones (a lane's
  # known Windows break must not hide a green macOS and Linux), plus the acceptance run. It runs on a push to an
  # integration branch and on a manual run; `gate` (below) keeps needing every job, Windows included, for pull requests
  # and the merge queue.
  lane-gate:
    name: lane gate
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [changes, names, machine, sealed-core, workspaces-pr, packages, installers, tree, link, linux-repo-signatures, gallery, typecheck, lockfiles, test-extension, macos, core-linux, scripts, protocol-codegen, swift, acceptance, agent-adapters, windows-fence-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # A green lane gate over a scoped run says so: which areas ran and which were skipped as untouched, and how many acceptance
      # units. The same lines go to the run's summary and to two annotations (`scripts/ci/lane wait` and `lane result` print them).
      - name: Scope of this run
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          RAN: ${{ needs.changes.outputs.scope_ran }}
          SKIPPED: ${{ needs.changes.outputs.scope_skipped }}
          UNITS: ${{ needs.changes.outputs.acceptance_units }}
        run: |
          echo "scope: ${SCOPE:-unknown (the changes job gave no scope: read it as a partial run)}"
          echo "scope: ran: ${RAN:-none}"
          echo "scope: skipped as untouched: ${SKIPPED:-none}"
          echo "scope: acceptance units: ${UNITS:-none}"
          echo "::notice title=scope::${SCOPE:-unknown}. Ran: ${RAN:-none}. Skipped as untouched: ${SKIPPED:-none}."
          echo "::notice title=scope units::acceptance units: ${UNITS:-none}"
          {
            echo "### Scope of this run"
            echo
            echo "${SCOPE:-unknown}"
            echo
            echo "- ran: ${RAN:-none}"
            echo "- skipped as untouched: ${SKIPPED:-none}"
            echo "- acceptance units: ${UNITS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every job passed, or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # Winter for Chrome's native host (apple/ComputerUse/WinterBrowserHost): framing, the relay, the daemon check (fakes
  # plus the real Security.framework decision against this process), identity. It imports nothing outside the system, so
  # it needs no Bun and no install. The old Mac app's Swift kits (WinterProtocol, WinterKit, WinterChatKit, the app) left
  # this repository (the owner's ruling, 2026-11-15); they stay on the maintenance branch and its tag.
  swift:
    name: swift (WinterBrowserHost)
    needs: changes
    # On demand only (workflow_dispatch), off the gate's macOS runners (owner's ruling, November 7), and only when the host's own folder changed
    # (scripts/ci-changes.ts PARKED) or the run asked for the parked areas (`parked: true`): the first release does not ship the old Chrome extension's host.
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: WinterBrowserHost — swift test
        working-directory: apple/ComputerUse/WinterBrowserHost
        run: swift test

  # The Cowork launcher (apple/Cowork/WinterCoworkLauncher) is its own Swift package and the `swift` job above never built it, so its tests ran only on a developer's machine.
  # Tests only, both configurations: the normal build, and the one with the compile-time test condition (it adds the tests that need the cdhash-pinned parent, which spawn the
  # package's own just-built launcher and FakeWorker as children of the test host: plain non-hypervisor processes, no VM, no libkrun, no sandbox call). Everything that signs
  # signs ad-hoc (`codesign --sign -`) in a temp directory; nothing touches a Keychain or `~/.moss*`. No bun, no workspace install: the package imports nothing but the system.
  swift-cowork-launcher:
    name: swift (WinterCoworkLauncher)
    needs: changes
    # Cowork is paused (spec §12): this runs on demand only (workflow_dispatch), not in an acceptance-only run, and only when Cowork's own sources changed
    # (apple/Cowork, packages/core/src/cowork: scripts/ci-changes.ts PARKED) or the run asked for the parked areas (`parked: true`). Not for CI's own edits, not for `all`.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only != 'acceptance' && github.event.inputs.only != 'acceptance-linux' && github.event.inputs.only != 'acceptance-windows' && needs.changes.outputs.cowork == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: WinterCoworkLauncher — swift test
        working-directory: apple/Cowork/WinterCoworkLauncher
        run: swift test --scratch-path "$RUNNER_TEMP/launcher-build"

      - name: WinterCoworkLauncher — swift test (WINTER_COWORK_TEST_BUILD)
        working-directory: apple/Cowork/WinterCoworkLauncher
        run: swift test --scratch-path "$RUNNER_TEMP/launcher-build-test" -Xswiftc -DWINTER_COWORK_TEST_BUILD

  # The libkrun production-profile patch queue (apple/Cowork/WinterCoworkLibkrun): fetch the pinned upstream source archive
  # (SHA-256 checked BEFORE it is extracted; the tree is data, nothing from inside it is run), compose the queue offline and
  # assert the pinned composed hash, then run the pure-Python guard tests including the composition test. No cargo, no
  # toolchain download, no archive build: that stays a local hash-pinned step (D7).
  # This workflow has no `paths` filters, so the scope check is the first step: the job always runs and reports a status
  # (success when the change is out of scope), so it can become a required check without ever being "skipped".
  libkrun-queue:
    name: libkrun patch queue
    needs: changes
    # Cowork is paused (spec §12): this runs on demand only (workflow_dispatch), not in an acceptance-only run, and only when Cowork's own sources changed
    # (apple/Cowork, packages/core/src/cowork: scripts/ci-changes.ts PARKED) or the run asked for the parked areas (`parked: true`). Not for CI's own edits, not for `all`. Skipped, the job reports success.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only != 'acceptance' && github.event.inputs.only != 'acceptance-linux' && github.event.inputs.only != 'acceptance-windows' && needs.changes.outputs.cowork == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is this change in scope?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          case "$EVENT" in
            pull_request) from="$BASE" ;;
            push) from="$BEFORE" ;;
            *) from="" ;;
          esac
          if [ -n "$from" ] && [ "$from" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
            if git diff --no-renames --name-only "$from" HEAD | grep -Eq '^(apple/Cowork/WinterCoworkLibkrun/|\.github/workflows/ci\.yml$)'; then run=true; else run=false; fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "libkrun queue checks in scope: ${run}"

      - name: Fetch the pinned upstream source (SHA-256 verified before extraction)
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: python3 -I -B scripts/fetch_inputs.py --source-only

      - name: Compose the queue offline and assert the composed hash
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: |
          python3 -I -B scripts/prepare_queue.py > "$RUNNER_TEMP/prepare.json"
          python3 -I -B -c "
          import json
          d = json.load(open('$RUNNER_TEMP/prepare.json'))
          assert d['fullSourceDiffSha256'] == '7ec7dd847bc09373d02ffe23894ca9f6ddebf2c992f8dbd2f251127823be5f24', d
          print('composed hash ok', d['fullSourceDiffSha256'])"

      - name: Guard tests (including the composition test)
        if: steps.scope.outputs.run == 'true'
        working-directory: apple/Cowork/WinterCoworkLibkrun
        run: python3 -I -B tests/test_queue_guards.py

  # The one check branch protection needs: it passes when every job above passed or was skipped because this change
  # does not touch its inputs, and fails when any failed or was cancelled.
  gate:
    name: gate
    if: always()
    needs: [changes, names, machine, machine-windows, sealed-core, sealed-core-windows, workspaces-pr, packages, installers, installers-windows, tree, tree-windows, link, link-windows, linux-repo-signatures, gallery, typecheck, lockfiles, test-extension, macos, core-linux, scripts, protocol-codegen, swift, windows-fence, agent-adapters, windows-fence-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
