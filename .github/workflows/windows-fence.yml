name: windows-fence

# Windows Bash and PowerShell under MOSS's fence (spec §4, §9.1, §14.1 item 2), on GitHub's windows-latest runner: the
# lane WS jobs. ci.yml calls this workflow (`windows-fence`); a push to a `lane/ws-*` branch runs it alone, so the lane
# can iterate on the Windows legs without the whole CI.
on:
  workflow_call:
  push:
    branches: ["lane/ws-*"]

permissions:
  contents: read
  packages: read

jobs:
  # The fence for real on windows-latest: the launcher built from the pinned source (its digest must be the pin), the
  # daemon built, `sandbox setup` from the protected copy (twice: idempotent), a bot's Bash and PowerShell and the
  # computer node's Bash fenced end to end with every refusal against a positive control
  # (packages/core/test/fence/win-fenced.e2e.test.ts), then `sandbox remove` (twice) and a check that nothing is left.
  e2e:
    name: windows fence · setup, Bash and PowerShell, remove
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - &bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - &where
        name: Where the job runs
        run: scripts/ci/windows-fence/probe-env.ps1

      - &launcher
        name: Build srt-win from the pinned source and compare its digest with the pin
        run: scripts/ci/windows-fence/build-launcher.ps1

      - &install
        name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - &daemon
        name: Build moss-core.exe
        run: bun scripts/build-daemon.ts --target windows-x64

      - name: sandbox setup, from the protected copy, twice
        timeout-minutes: 20
        run: scripts/ci/windows-fence/setup.ps1

      - name: Bash and PowerShell under the fence, end to end
        timeout-minutes: 40
        working-directory: packages/core
        run: |
          $env:MOSS_WIN_FENCE_E2E = "1"
          $env:MOSS_SRT_WIN = Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "MOSS Sandbox\$([System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value)\srt-win.exe"
          bun test --timeout 900000 test/fence/win-fenced.e2e.test.ts

      - name: sandbox remove, twice, and nothing left
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: scripts/ci/windows-fence/remove.ps1

  # The daemon as it runs for real: a standard user's, started by its password startup task, so in Session 0 with a
  # password logon. The user's unelevated setup refuses with exit 2; an administrator sets the sandbox up for it from
  # the user's protected copy; the same end-to-end suite runs inside the user's task; the administrator removes it.
  standard-user:
    name: windows fence · a standard user's startup task (Session 0)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - *checkout
      - *bun
      - *where
      - *launcher
      - *install
      - *daemon
      - name: Set up, run the fenced suite as the user's task, remove
        timeout-minutes: 60
        run: scripts/ci/windows-fence/standard-user.ps1

  # The Windows fence's own unit tests, which no other job ran (the core suite's Windows run doesn't exist; the Linux
  # shards skip them): the named pipe, the job object and the launcher's pure half.
  unit:
    name: windows fence · unit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Core · the Windows fence's unit tests
        working-directory: packages/core
        run: bun test --timeout 30000 test/platform/win-pipe.test.ts test/platform/win-job.test.ts test/fence/win-sandbox.test.ts test/fence/win-fenced.test.ts
