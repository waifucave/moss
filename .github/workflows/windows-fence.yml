name: windows-fence

# Windows Bash and PowerShell under MOSS's fence (spec §4, §9.1, §14.1 item 2), on GitHub's windows-latest runner: the
# lane WS jobs. ci.yml calls this workflow (`windows-fence`); a push to a `lane/ws-*` branch runs it alone, so the lane
# can iterate on the Windows legs without the whole CI.
on:
  # From ci.yml: `only: e2e` runs the end-to-end job alone (the lane gate's fence guard, lane WS11); `skip_e2e` leaves it to that guard.
  workflow_call:
    inputs:
      only:
        type: string
        default: ""
      skip_e2e:
        type: boolean
        default: false
  push:
    branches: ["lane/ws-*"]

permissions:
  contents: read
  packages: read

jobs:
  # The fence for real on windows-latest: the launcher built from the pinned source (its digest must be the pin), the
  # daemon built, `sandbox setup` from the protected copy (twice: idempotent), a bot's Bash and PowerShell and the
  # computer node's Bash fenced end to end with every refusal against a positive control
  # (packages/core/test/fence/win-fenced.e2e.test.ts), then `sandbox remove` (twice) and a check that nothing is left.
  e2e:
    name: windows fence · setup, Bash and PowerShell, remove
    if: ${{ inputs.skip_e2e != true }}
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - &bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - &where
        name: Where the job runs
        run: scripts/ci/windows-fence/probe-env.ps1

      - &launcher
        name: Build srt-win from the pinned source and compare its digest with the pin
        run: scripts/ci/windows-fence/build-launcher.ps1

      - &install
        name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - &daemon
        name: Build moss-core.exe
        run: bun scripts/build-daemon.ts --target windows-x64

      - name: sandbox setup, from the protected copy, twice
        timeout-minutes: 40
        run: scripts/ci/windows-fence/setup.ps1

      - name: Where a fenced command's time goes (the launcher's logon, the shells, the reset, the read grant; the delete-child guard)
        timeout-minutes: 20
        run: scripts/ci/windows-fence/timing.ps1

      - name: Bash and PowerShell under the fence, end to end
        timeout-minutes: 40
        working-directory: packages/core
        run: |
          $env:MOSS_WIN_FENCE_E2E = "1"
          $env:MOSS_WIN_FENCE_TIMING = "1"
          bun test --timeout 900000 test/fence/win-fenced.e2e.test.ts

      - name: sandbox remove, twice, and nothing left
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: scripts/ci/windows-fence/remove.ps1

      # Lane WS7: srt-win's own tests of the ACL code the MOSS patches change (patch 0004's entry shapes, and an access
      # check of the delete-child entries), in the tree the launcher step patched: its release build compiles no test.
      - name: srt-win's tests of the patched ACL code (acl's unit tests, the access-check cases)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        working-directory: vendor/srt-win-src/vendor/srt-win-src
        run: |
          cargo test --locked --lib acl::
          $unit = $LASTEXITCODE
          cargo test --locked --test persistent_grant_access_check
          $access = $LASTEXITCODE
          Write-Output "acl unit tests: exit $unit; access-check tests: exit $access"
          if ($unit -ne 0 -or $access -ne 0) { exit 1 }

  # The daemon as it runs for real: a standard user's, started by its password startup task, so in Session 0 with a
  # password logon. The user's unelevated setup refuses with exit 2; an administrator sets the sandbox up for it from
  # the user's protected copy; the same end-to-end suite runs inside the user's task; the administrator removes it.
  standard-user:
    name: windows fence · a standard user's startup task (Session 0)
    if: ${{ inputs.only != 'e2e' }}
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - *checkout
      - *bun
      - *where
      - *launcher
      - *install
      - *daemon
      - name: Set up, run the fenced suite as the user's task, remove
        timeout-minutes: 60
        run: scripts/ci/windows-fence/standard-user.ps1

  # Windows on Arm (lane WS7): what runs on GitHub's arm64 Windows image (`windows-11-arm`, free for public
  # repositories). The launcher is built natively for arm64 with MOSS's patches and its digest compared with the arm64
  # pin; Bun's own architecture there and whether it compiles a binary for `bun-windows-arm64` are recorded (the daemon
  # has no arm64 Windows target yet); the fence's unit tests run.
  arm64:
    name: windows fence · arm64 (launcher, Bun, unit)
    if: ${{ inputs.only != 'e2e' }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - *checkout
      - *bun
      - *where
      - name: Bun on this machine, and a compile for bun-windows-arm64
        continue-on-error: true
        run: |
          bun -e "console.log(JSON.stringify({ bun: Bun.version, arch: process.arch, platform: process.platform }))"
          Set-Content -LiteralPath hello.ts -Value 'console.log(JSON.stringify({ hello: process.arch }))'
          bun build --compile --target=bun-windows-arm64 hello.ts --outfile hello-arm64.exe
          if (Test-Path hello-arm64.exe) { & ./hello-arm64.exe } else { Write-Output "no bun-windows-arm64 binary was made" }
      - name: Build srt-win natively for arm64 from the pinned source and compare its digest with the arm64 pin
        run: scripts/ci/windows-fence/build-launcher.ps1
      # The workspace's install runs workerd's postinstall (wrangler's), which has no Windows arm64 binary and fails;
      # the fence's tests need none of the install scripts.
      - name: Install dependencies (no install scripts)
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Core · the Windows fence's unit tests (arm64)
        working-directory: packages/core
        run: bun test --timeout 30000 test/platform/win-pipe.test.ts test/platform/win-job.test.ts test/fence/win-sandbox.test.ts test/fence/win-fenced.test.ts test/fence/fold-paths.test.ts test/fence/long-path.test.ts

  # The Windows fence's own unit tests, which no other job ran (the core suite's Windows run doesn't exist; the Linux
  # shards skip them): the named pipe, the job object and the launcher's pure half.
  unit:
    name: windows fence · unit
    if: ${{ inputs.only != 'e2e' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Core · the Windows fence's unit tests
        working-directory: packages/core
        run: bun test --timeout 30000 test/platform/win-pipe.test.ts test/platform/win-job.test.ts test/fence/win-sandbox.test.ts test/fence/win-fenced.test.ts test/fence/fold-paths.test.ts test/fence/long-path.test.ts

      - name: Core · the plugin host's link, the plugin guard, the secrets store and the ACL read-back on Windows
        working-directory: packages/core
        run: bun test --timeout 60000 src/plugin-host/tests/process.test.ts src/plugin-host/tests/windows-link.test.ts src/registry/tests/plugin-guard-windows.test.ts src/secrets/tests/windows-store.test.ts test/platform/win-acl.test.ts test/platform/caller-probe.test.ts test/platform/one-shot-pipes-windows.test.ts

      - name: Core · a bot session on the embedded runtime, the fenced shell tools swapped in (agent SDK 0.0.88)
        working-directory: packages/core
        run: |
          $env:MOSS_WIN_RUNTIME_E2E = "1"
          bun test --timeout 300000 test/fence/win-driver.e2e.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Lane WS8: MOSS's coding agent's real turn on Windows, its Bash MOSS's.
          bun test --timeout 300000 src/agents/tests/moss-code.test.ts -t "a real agent turn on Windows"
